name: PR Labeler

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR from Conventional Commit title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const typeMatch = title.match(/^(\w+)(\(.+\))?!?:/);
            if (!typeMatch) {
              console.log('No Conventional Commit prefix found; skipping labels.');
              return;
            }

            const type = typeMatch[1];
            const labelMap = {
              feat: 'feature',
              fix: 'bug',
              docs: 'documentation',
              style: 'style',
              refactor: 'refactor',
              perf: 'performance',
              test: 'tests',
              build: 'build',
              ci: 'ci',
              chore: 'chore',
              revert: 'revert',
            };

            const label = labelMap[type] || type;
            const labels = [label];

            if (title.includes('!')) {
              labels.push('breaking change');
            }

            const existing = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existingNames = new Set(existing.data.map((l) => l.name));

            for (const name of labels) {
              if (!existingNames.has(name)) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: 'ededed',
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels,
            });
