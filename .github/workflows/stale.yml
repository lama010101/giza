name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been marked as stale because it has been open for 60 days with no activity. Remove the stale label or comment to keep it open.'
          stale-pr-message: 'This pull request has been marked as stale because it has been open for 30 days with no activity. Remove the stale label or comment to keep it open.'
          close-issue-message: 'Closing this stale issue. Reopen if it is still relevant.'
          close-pr-message: 'Closing this stale pull request. Reopen if it is still relevant.'
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'keep,blocked,pinned'
          exempt-pr-labels: 'keep,blocked,pinned'
